name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package generic binary, .deb, and .rpm
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/supernova-tui"
          VERSION="${GITHUB_REF_NAME#v}"

          cp "$BIN" "dist/supernova-tui-linux-${{ matrix.arch }}"
          tar -czf "dist/supernova-tui-linux-${{ matrix.arch }}.tar.gz" -C "target/${{ matrix.target }}/release" supernova-tui -C "$GITHUB_WORKSPACE" README.md

          chmod +x packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh "$BIN" dist

          RPM_TOP="$(mktemp -d)"
          mkdir -p "$RPM_TOP"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "$BIN" "$RPM_TOP/SOURCES/supernova-tui"
          cp README.md "$RPM_TOP/SOURCES/README.md"
          rpmbuild --define "_topdir $RPM_TOP" --define "_arch ${{ matrix.arch }}" -bb packaging/rpm/supernova-tui.spec
          find "$RPM_TOP/RPMS" -name '*.rpm' -exec cp {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
